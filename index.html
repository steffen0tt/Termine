<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Termine 2026 - Finkenau Musikkindergarten</title>
<style>
  :root{
    --bg:#fbfbfd;
    --card:#ffffff;
    --text:#263238;
    --muted:#61717a;
    --accent:#0066c0;
    --radius:14px;
    --padding:18px;
    --gap:16px;
    --pastel-blue: #d8eefe;
    --pastel-red: #ffd9d9;
    --pastel-green: #e6f7ea;
    --pastel-orange: #fff0da;
    --pastel-purple: #f3e9ff;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    background:var(--bg);
    color:var(--text);
  }
  header{
    position:relative;
    overflow:hidden;
    background: linear-gradient(100deg,#6fb1ff,#9bd1ff);
    padding:30px 16px 34px;
    text-align:center;
    color:white;
  }
  header h1{ margin:0; font-size:1.65rem; font-weight:800; }
  .year-badge{ display:inline-block; margin-top:8px; padding:4px 14px; border-radius:999px; background:rgba(255,255,255,0.25); font-weight:700; font-size:0.9rem; letter-spacing:.02em; }
  header p{ margin:10px 0 0; opacity:0.95; font-size:0.95rem; }
  header .wave{ position:absolute; bottom:-1px; left:0; width:100%; line-height:0; }
  nav{ display:flex; gap:8px; margin-top:14px; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:thin; padding:2px 2px 8px; }
  nav::-webkit-scrollbar{ height:6px; }
  nav::-webkit-scrollbar-thumb{ background:rgba(255,255,255,0.5); border-radius:99px; }
  @media (min-width:700px){ nav{ flex-wrap:wrap; justify-content:center; overflow-x:visible; padding-bottom:0; } }
  .filter-btn{
    background:white;
    border-radius:999px;
    padding:8px 12px;
    font-weight:700;
    border:1px solid rgba(0,0,0,0.06);
    cursor:pointer;
    color:var(--text);
    flex:0 0 auto;
    white-space:nowrap;
    scroll-snap-align:start;
  }
  /* aktiv: dunkler Hintergrund + weißer Text */
  .filter-btn.active{
    background:var(--accent);
    color:#ffffff;
    box-shadow:0 6px 18px rgba(0,0,0,0.08);
    transform:translateY(-2px);
  }
  main{ max-width:1100px; margin:20px auto; padding:18px; }
  .month { margin-bottom:26px; }
  .month h2{ margin:6px 6px 12px; font-size:1.05rem; color:#233444; display:flex; align-items:center; gap:8px; }
  .grid{ display:grid; grid-template-columns: repeat(auto-fit,minmax(260px,1fr)); gap:var(--gap); }
  .card{ background:var(--card); border-radius:var(--radius); padding:14px; box-shadow:0 6px 18px rgba(20,40,60,0.06); display:flex; flex-direction:column; gap:10px; transition:transform .14s ease; min-height:120px; }
  .card:hover{ transform:translateY(-6px); box-shadow:0 14px 30px rgba(20,40,60,0.08); }
  .row { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .title{ font-weight:600; font-size:1rem; color:var(--text); }
  .meta{ font-size:0.92rem; color:var(--muted); }
  .time { font-weight:700; color:#223344; }
  .pill{ padding:6px 10px; border-radius:999px; font-size:0.78rem; font-weight:600; display:inline-flex; gap:8px; align-items:center; }
  .type-parents { background: var(--pastel-blue); color:#064b8b; }
  .type-closed  { background: var(--pastel-red);  color:#8b1d1d; }
  .type-party   { background: var(--pastel-green); color:#13522a; }
  .type-info    { background: var(--pastel-orange); color:#6a3f00; }
  .type-other   { background: var(--pastel-purple); color:#4b2a7a; }
  .buttons{ margin-top:auto; display:flex; gap:8px; flex-wrap:wrap; }
  .btn{ background:linear-gradient(180deg,#ffffff, #f6f8ff); border:1px solid rgba(0,0,0,0.06); padding:8px 12px; border-radius:10px; font-weight:600; font-size:0.9rem; color:var(--accent); text-decoration:none; display:inline-flex; gap:8px; align-items:center; }
  .btn-ical{ background:linear-gradient(180deg,#fff,#f7fff8); color:#0a7a3f; border-color:rgba(10,122,63,0.12) }
  .btn-google{ background:linear-gradient(180deg,#fff,#f2f6ff); color:#134f9c; border-color:rgba(19,79,156,0.12) }
  .btn-outlook{ background:linear-gradient(180deg,#fff,#fffaf6); color:#a45a00; border-color:rgba(164,90,0,0.12) }
  footer{ text-align:center; color:var(--muted); font-size:0.9rem; margin:28px auto 60px; }
  @media (max-width:520px){ header h1{ font-size:1.2rem; } .card{ padding:12px; } main{ padding:12px; } }

  .upcoming{ max-width:1100px; margin:22px auto 0; padding:0 18px; }
  .upcoming h2{ margin:0 0 10px; font-size:1rem; color:#233444; }
  .upcoming-scroll{ display:flex; gap:12px; overflow-x:auto; padding-bottom:8px; -webkit-overflow-scrolling:touch; }
  .upcoming-chip{ flex:0 0 220px; background:var(--card); border-radius:12px; padding:12px 14px; box-shadow:0 6px 18px rgba(20,40,60,0.06); text-decoration:none; color:inherit; display:flex; flex-direction:column; gap:4px; scroll-snap-align:start; transition:box-shadow .14s ease; }
  .upcoming-chip:hover{ box-shadow:0 10px 26px rgba(20,40,60,0.1); }
  .uc-when{ font-weight:700; color:var(--accent); font-size:.82rem; }
  .uc-title{ font-weight:600; font-size:.92rem; }
  .uc-time{ font-size:.82rem; color:var(--muted); }
  .badge-soon{ display:inline-block; margin-left:6px; padding:2px 8px; border-radius:999px; background:var(--accent); color:#fff; font-size:.72rem; font-weight:700; vertical-align:middle; }
  .cal-menu{ margin-top:auto; position:relative; width:fit-content; }
  .cal-menu > summary{ list-style:none; cursor:pointer; }
  .cal-menu > summary::-webkit-details-marker{ display:none; }
  .cal-menu[open] > summary{ background:var(--accent); color:#fff; border-color:var(--accent); }
  .cal-menu-list{ position:absolute; z-index:5; top:calc(100% + 6px); left:0; display:flex; flex-direction:column; gap:6px; background:var(--card); padding:8px; border-radius:12px; box-shadow:0 10px 30px rgba(20,40,60,0.18); min-width:160px; }
  .cal-menu-list .btn{ width:100%; }
  .past-section{ max-width:1100px; margin:36px auto 10px; padding:0 18px; }
  .past-section > summary{ cursor:pointer; list-style:none; font-weight:700; color:var(--muted); padding:10px 16px; background:#fff; border-radius:999px; width:fit-content; box-shadow:0 4px 14px rgba(20,40,60,0.05); }
  .past-section > summary::-webkit-details-marker{ display:none; }
  .past-section > summary::before{ content:"▸ "; }
  .past-section[open] > summary::before{ content:"▾ "; }
  .past-section #past-main{ margin-top:16px; }
  .card.past{ opacity:.55; }
  .card.past:hover{ opacity:.85; }
  @media (max-width:520px){ .upcoming-chip{ flex-basis:180px; } }
</style>
</head>
<body>
<header>
  <h1>Finkenau Musikkindergarten</h1>
  <div class="year-badge" id="year-badge">Termine 2026</div>
  <p class="sub">Änderungen vorbehalten, Zeiten können abweichen, Aushänge bitte beachten</p>
  <nav id="filters" aria-label="Gruppen Filter" style="margin-top:14px">
    <button class="filter-btn active" data-group="all">🌍 Alle</button>
    <button class="filter-btn" data-group="Klavierschildkröten">🐢 Klavierschildkröten</button>
    <button class="filter-btn" data-group="Klangkobolde">🧚 Klangkobolde</button>
    <button class="filter-btn" data-group="Trompetentiger">🐯 Trompetentiger</button>
    <button class="filter-btn" data-group="Flötenfohlen">🐴 Flötenfohlen</button>
    <button class="filter-btn" data-group="Melodiemäuse">🐭 Melodiemäuse</button>
    <button class="filter-btn" data-group="Musikwichtel">🎵 Musikwichtel</button>
  </nav>
  <svg class="wave" viewBox="0 0 1440 40" preserveAspectRatio="none" aria-hidden="true"><path fill="#fbfbfd" d="M0,20 C480,0 960,40 1440,10 L1440,40 L0,40 Z"></path></svg>
</header>

<div id="upcoming-wrap"></div>

<main id="main"></main>

<details id="past-section" class="past-section" hidden>
  <summary id="past-summary">Vergangene Termine anzeigen</summary>
  <div id="past-main"></div>
</details>

<footer>
      <div style="margin-top:12px">
    <a id="feed-download" href="#" style="color:rgba(255,255,255,0.95); text-decoration:underline; margin-right:16px;">📥 Alle Termine als iCal herunterladen</a>
  </div>
  
  Stand: Oktober 2025 · Zeitzone: <strong>Europe/Berlin</strong>

</footer>

<script>
/* ============================================================
   TERMINE - Datenquelle
   Die Termine liegen NICHT mehr in diesem Script, sondern in der
   Datei events.json (gleicher Ordner). So kannst du Termine
   hinzufuegen/aendern/loeschen, ohne JavaScript zu beruehren -
   am einfachsten direkt im Browser ueber den Stift-Button bei
   events.json auf github.com.

   Format pro Termin (JSON):
   {
     "title": "Elternabend Floetenfohlen",
     "start": "2026-02-04T18:00:00",
     "end":   "2026-02-04T19:00:00"
   }
   Optional: "type": "parents" | "closed" | "party" | "info" | "other"
   (ueberschreibt die automatische Erkennung am Titel, falls die
   mal danebenliegt).

   Datumsformat:
   - Ganztaegig (z.B. Kita geschlossen): "YYYY-MM-DD" (ohne Uhrzeit)
   - Mit Uhrzeit (z.B. Elternabend):    "YYYY-MM-DDTHH:MM:SS"

   Die Gruppe (Klavierschildkroeten, Klangkobolde, ...) wird
   automatisch erkannt, wenn der Gruppenname im "title" vorkommt.

   Termin hinzufuegen: neues { ... }-Objekt in events.json einfuegen
   (auf Kommas zwischen den Objekten achten!).
   Termin loeschen: das Objekt in events.json entfernen.
   Termin aendern: Werte in events.json anpassen.

   Vergangene vs. kommende Termine: die Seite berechnet das immer
   anhand des aktuellen Datums im Browser - dafuer muss nichts in
   events.json gepflegt werden.

   Tipp zum Testen auf dem eigenen Rechner: Doppelklick auf
   index.html funktioniert NICHT (Browser blockieren das Laden
   lokaler JSON-Dateien per file://). Im Ordner stattdessen z.B.
   "python3 -m http.server" ausfuehren und http://localhost:8000
   oeffnen - oder direkt auf GitHub Pages testen.
   ============================================================ */

const EVENTS_URL = "events.json";
const UPCOMING_COUNT = 4;

/* groups to filter by */
const groups = ["Klavierschildkröten","Klangkobolde","Trompetentiger","Flötenfohlen","Melodiemäuse","Musikwichtel"];

/* helpers */
function toDate(s){ return s.includes("T") ? new Date(s) : new Date(s + "T00:00:00"); }
function monthKey(dt){ return dt.toLocaleString("de-DE",{ month:"long", year:"numeric" }); }
function pad(n){ return n.toString().padStart(2,"0"); }

/* ein Termin gilt als "vergangen", sobald sein Ende (bei ganztaegigen:
   Ende des End-Tages) in der Vergangenheit liegt */
function isPast(ev){
  const e = toDate(ev.end);
  if(!ev.end.includes("T")) e.setHours(23,59,59,999);
  return e.getTime() < Date.now();
}

/* "Heute" / "Morgen" / "in 3 Tagen" - nur fuer Termine in den naechsten 7 Tagen */
function relativeLabel(ev){
  const today = new Date(); today.setHours(0,0,0,0);
  const startDay = toDate(ev.start); startDay.setHours(0,0,0,0);
  const diffDays = Math.round((startDay - today) / 86400000);
  if(diffDays < 0) return null;
  if(diffDays === 0) return "Heute";
  if(diffDays === 1) return "Morgen";
  if(diffDays <= 7) return `in ${diffDays} Tagen`;
  return null;
}

/* validate a single event; returns an error string or null if OK */
function validateEvent(ev, idx){
  if(!ev || typeof ev !== "object") return `Eintrag #${idx+1}: kein gültiges Objekt`;
  if(!ev.title || typeof ev.title !== "string") return `Eintrag #${idx+1}: "title" fehlt oder ist kein Text`;
  if(!ev.start || isNaN(toDate(ev.start).getTime())) return `Eintrag #${idx+1} ("${ev.title}"): "start" ist kein gültiges Datum (${ev.start})`;
  if(!ev.end || isNaN(toDate(ev.end).getTime())) return `Eintrag #${idx+1} ("${ev.title}"): "end" ist kein gültiges Datum (${ev.end})`;
  return null;
}

/* determine which groups an event applies to */
function eventGroups(ev){
  const title = ev.title.toLowerCase();
  const matched = groups.filter(g => title.includes(g.toLowerCase()));
  return matched.length ? matched : ["all"];
}

/* display formatting */
function displayDateRange(ev){
  const s = toDate(ev.start), e = toDate(ev.end);
  if(s.toDateString() === e.toDateString()){
    return s.toLocaleDateString("de-DE",{ weekday:"short", day:"2-digit", month:"2-digit", year:"numeric" });
  } else {
    const from = s.toLocaleDateString("de-DE",{ day:"2-digit", month:"2-digit", year:"numeric" });
    const to = e.toLocaleDateString("de-DE",{ day:"2-digit", month:"2-digit", year:"numeric" });
    return `${from} – ${to}`;
  }
}
function displayTime(ev){
  if(ev.start.includes("T")){
    return `${toDate(ev.start).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"})} – ${toDate(ev.end).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"})}`;
  } else return "ganztägig";
}

/* ---- ICS (iCal) Aufbau - Europe/Berlin ---- */
function toICSDateTimeLocal(s){
  if(!s.includes("T")) return s.replace(/-/g,"");
  const d = new Date(s);
  return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
}
function utcNowICS(){ return toICSDateTimeLocal(new Date().toISOString()); }

/* create VEVENT with VALARM 2 days before */
function createVEvent(ev, uidSuffix){
  const uid = `${Date.now()}-${uidSuffix}@kitatermine.local`;
  const dtstamp = utcNowICS();
  const alarm = ["BEGIN:VALARM","TRIGGER:-P2D","ACTION:DISPLAY","DESCRIPTION:Erinnerung: Termin in 2 Tagen","END:VALARM"];
  if(!ev.start.includes("T")){
    const startY = ev.start.replace(/-/g,"");
    const endDate = new Date(ev.end + "T00:00:00"); endDate.setDate(endDate.getDate()+1);
    const endY = endDate.toISOString().slice(0,10).replace(/-/g,"");
    return ["BEGIN:VEVENT",`UID:${uid}`,`DTSTAMP:${dtstamp}`,`DTSTART;VALUE=DATE:${startY}`,`DTEND;VALUE=DATE:${endY}`,`SUMMARY:${ev.title}`,...alarm,"END:VEVENT"].join("\r\n");
  } else {
    const dtStart = toICSDateTimeLocal(ev.start);
    const dtEnd = toICSDateTimeLocal(ev.end);
    return ["BEGIN:VEVENT",`UID:${uid}`,`DTSTAMP:${dtstamp}`,`DTSTART;TZID=Europe/Berlin:${dtStart}`,`DTEND;TZID=Europe/Berlin:${dtEnd}`,`SUMMARY:${ev.title}`,...alarm,"END:VEVENT"].join("\r\n");
  }
}

/* build global ICS containing all events (used by "Alle Termine als iCal herunterladen") */
function buildGlobalICS(events){
  const vevents = events.map((ev,i)=>createVEvent(ev, "all"+i)).join("\r\n");
  return ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Kita-Termine//DE","CALSCALE:GREGORIAN","METHOD:PUBLISH",vevents,"END:VCALENDAR"].join("\r\n");
}

/* per-event ICS data URL */
function buildEventICSDataUrl(ev, idx){
  const content = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Kita-Termine//DE",createVEvent(ev, "ev"+idx),"END:VCALENDAR"].join("\r\n");
  return "data:text/calendar;charset=utf-8," + encodeURIComponent(content);
}

/* Google link - event creation. Hinweis: Google-Link kann keine Erinnerung setzen -> iCal empfehlen */
function buildGoogleUrl(ev){
  const details = encodeURIComponent("Hinweis: Für eine automatische Erinnerung 2 Tage vorher bitte die iCal(.ics)-Datei importieren oder in den Erinnerungen 2 Tage vorher hinzufügen.");
  if(!ev.start.includes("T")){
    const startY = ev.start.replace(/-/g,"");
    const endDate = new Date(ev.end + "T00:00:00"); endDate.setDate(endDate.getDate()+1);
    const endY = endDate.toISOString().slice(0,10).replace(/-/g,"");
    return `https://calendar.google.com/calendar/r/eventedit?text=${encodeURIComponent(ev.title)}&dates=${startY}/${endY}&ctz=Europe/Berlin&details=${details}`;
  } else {
    const s = toICSDateTimeLocal(ev.start);
    const e = toICSDateTimeLocal(ev.end);
    return `https://calendar.google.com/calendar/r/eventedit?text=${encodeURIComponent(ev.title)}&dates=${s}/${e}&ctz=Europe/Berlin&details=${details}`;
  }
}

/* Outlook web compose link */
function toISOForOutlook(s){
  if(!s.includes("T")) return s;
  const d = new Date(s);
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}
function buildOutlookUrl(ev){
  const body = encodeURIComponent("Erinnerung: Dieses Event enthält eine .ics mit einem Alarm 2 Tage vorher — beim Import wird die Erinnerung übernommen.");
  if(!ev.start.includes("T")){
    const start = ev.start;
    const endDate = new Date(ev.end + "T00:00:00"); endDate.setDate(endDate.getDate()+1);
    const end = endDate.toISOString().slice(0,10);
    return `https://outlook.live.com/calendar/0/deeplink/compose?subject=${encodeURIComponent(ev.title)}&startdt=${encodeURIComponent(start)}&enddt=${encodeURIComponent(end)}&body=${body}`;
  } else {
    const start = toISOForOutlook(ev.start);
    const end = toISOForOutlook(ev.end);
    return `https://outlook.live.com/calendar/0/deeplink/compose?subject=${encodeURIComponent(ev.title)}&startdt=${encodeURIComponent(start)}&enddt=${encodeURIComponent(end)}&body=${body}`;
  }
}

/* type metadata for pills and colors */
const typeMeta = {
  parents: { label:"Elternabend", cls:"type-parents", emoji:"👩‍🏫" },
  closed:  { label:"Kita geschlossen", cls:"type-closed",  emoji:"🚫" },
  party:   { label:"Fest / Basteln", cls:"type-party",   emoji:"🎉" },
  info:    { label:"Elternrat / Info", cls:"type-info",  emoji:"👥" },
  other:   { label:"Sonstiges", cls:"type-other", emoji:"✨" }
};

/* auto-detect type by title (kann pro Termin mit "type" in events.json ueberschrieben werden) */
function detectType(ev){
  if(ev.type && typeMeta[ev.type]) return ev.type;
  const t = ev.title.toLowerCase();
  if(t.includes("elternabend")) return "parents";
  if(t.includes("kita geschlossen")||t.includes("sommerschließzeit")||t.includes("konzepttag")||t.includes("winterschließzeit")||t.includes("regenerationstag")||t.includes("betriebsausflug")||t.includes("tag der")) return "closed";
  if(t.includes("fest")||t.includes("konzert")||t.includes("basteln")||t.includes("adventssingen")||t.includes("licht")||t.includes("sommerfest")||t.includes("verabschiedung")) return "party";
  if(t.includes("elternrat")||t.includes("info")) return "info";
  return "other";
}

/* baut die Kalender-Buttons (iCal/Google/Outlook) als Dropdown, statt drei
   einzelne Buttons auf jeder Karte zu zeigen (kompakter) */
function buildCalMenu(ev, idx){
  const details = document.createElement("details"); details.className = "cal-menu";
  const summary = document.createElement("summary"); summary.className = "btn btn-cal-toggle"; summary.innerHTML = "🗓️ Kalender";
  details.appendChild(summary);
  const list = document.createElement("div"); list.className = "cal-menu-list";

  const aIcal = document.createElement("a"); aIcal.className="btn btn-ical"; aIcal.href = buildEventICSDataUrl(ev, idx); aIcal.setAttribute("download", ev.title.replace(/[^\w\d\-_]+/g,"_") + ".ics"); aIcal.innerHTML="📅 iCal";
  const aGoogle = document.createElement("a"); aGoogle.className="btn btn-google"; aGoogle.href = buildGoogleUrl(ev); aGoogle.target="_blank"; aGoogle.rel="noopener noreferrer"; aGoogle.innerHTML="📆 Google";
  const aOutlook = document.createElement("a"); aOutlook.className="btn btn-outlook"; aOutlook.href = buildOutlookUrl(ev); aOutlook.target="_blank"; aOutlook.rel="noopener noreferrer"; aOutlook.innerHTML="📧 Outlook";
  list.appendChild(aIcal); list.appendChild(aGoogle); list.appendChild(aOutlook);
  details.appendChild(list);
  return details;
}

/* baut eine einzelne Termin-Karte */
function buildCard(ev, idx, extraClass){
  const evGroups = eventGroups(ev);
  const card = document.createElement("article");
  card.className = "card" + (extraClass ? " " + extraClass : "");
  card.id = ev.__id;
  card.dataset.groups = evGroups.join(",");

  const metaRow = document.createElement("div"); metaRow.className="row";
  const left = document.createElement("div"); left.style.flex="1";
  const title = document.createElement("div"); title.className="title"; title.textContent = ev.title;
  const date = document.createElement("div"); date.className="meta";
  date.textContent = displayDateRange(ev);
  const soon = relativeLabel(ev);
  if(soon){
    const b = document.createElement("span"); b.className="badge-soon"; b.textContent = soon;
    date.appendChild(document.createTextNode(" "));
    date.appendChild(b);
  }
  left.appendChild(title); left.appendChild(date);

  const right = document.createElement("div"); right.style.textAlign="right";
  const typ = detectType(ev);
  const tm = typeMeta[typ] || typeMeta.other;
  const pill = document.createElement("div"); pill.className = "pill " + tm.cls; pill.innerHTML = `<span style="font-size:1.05rem">${tm.emoji}</span> <span style="opacity:0.95">${tm.label}</span>`;
  right.appendChild(pill);
  metaRow.appendChild(left); metaRow.appendChild(right);

  const timeRow = document.createElement("div"); timeRow.className="row";
  const timeDiv = document.createElement("div"); timeDiv.className="time"; timeDiv.textContent = displayTime(ev);
  timeRow.appendChild(timeDiv);

  card.appendChild(metaRow);
  card.appendChild(timeRow);
  card.appendChild(buildCalMenu(ev, idx));
  return card;
}

/* gruppiert Termine nach Monat und rendert sie in "container" */
function renderMonthGrid(container, events, extraCardClass){
  container.innerHTML = "";
  const months = {};
  events.forEach(ev=>{
    const key = monthKey(toDate(ev.start));
    months[key] = months[key] || [];
    months[key].push(ev);
  });
  Object.keys(months).forEach(monthName => {
    const section = document.createElement("section");
    section.className = "month";
    const h = document.createElement("h2");
    h.innerHTML = `<span class="dot" style="width:10px;height:10px;border-radius:50%;background:var(--accent);display:inline-block;transform:translateY(1px)"></span> ${monthName.charAt(0).toUpperCase()+monthName.slice(1)}`;
    section.appendChild(h);
    const grid = document.createElement("div"); grid.className="grid";
    months[monthName].forEach(ev=>{
      grid.appendChild(buildCard(ev, ev.__idx, extraCardClass));
    });
    section.appendChild(grid);
    container.appendChild(section);
  });
}

/* kompakte, horizontal scrollbare Liste der naechsten anstehenden Termine
   ganz oben, damit man nicht erst an vergangenen Terminen vorbeiscrollen muss */
function renderUpcomingStrip(upcoming){
  const wrap = document.getElementById("upcoming-wrap");
  if(!upcoming.length){ wrap.innerHTML = ""; return; }
  const section = document.createElement("section"); section.className = "upcoming";
  const h = document.createElement("h2"); h.textContent = "Nächste Termine";
  section.appendChild(h);
  const scroller = document.createElement("div"); scroller.className = "upcoming-scroll";
  upcoming.slice(0, UPCOMING_COUNT).forEach(ev=>{
    const a = document.createElement("a"); a.className = "upcoming-chip"; a.href = "#" + ev.__id;
    const when = document.createElement("div"); when.className = "uc-when";
    when.textContent = relativeLabel(ev) || displayDateRange(ev);
    const title = document.createElement("div"); title.className = "uc-title"; title.textContent = ev.title;
    const time = document.createElement("div"); time.className = "uc-time"; time.textContent = displayTime(ev);
    a.appendChild(when); a.appendChild(title); a.appendChild(time);
    scroller.appendChild(a);
  });
  section.appendChild(scroller);
  wrap.innerHTML = "";
  wrap.appendChild(section);
}

/* RENDER */
function renderError(message){
  const main = document.getElementById("main");
  main.innerHTML = `<div style="max-width:640px;margin:40px auto;padding:20px;background:#fff0da;border-radius:14px;color:#6a3f00;">
    <strong>⚠️ Die Termine konnten nicht geladen werden.</strong><br>${message}
  </div>`;
}

function updateYearLabel(events){
  if(!events.length) return;
  const years = events.map(ev => toDate(ev.start).getFullYear());
  const minY = Math.min(...years), maxY = Math.max(...years);
  const label = minY === maxY ? `Termine ${minY}` : `Termine ${minY}–${maxY}`;
  const badge = document.getElementById("year-badge");
  if(badge) badge.textContent = label;
  document.title = label + " - Finkenau Musikkindergarten";
  return { minY, maxY };
}

function renderEvents(events){
  events.sort((a,b)=> toDate(a.start) - toDate(b.start));
  events.forEach((ev,i)=>{ ev.__id = "ev-" + i; ev.__idx = i; });
  const yearRange = updateYearLabel(events);

  const upcoming = events.filter(ev => !isPast(ev));
  const past = events.filter(isPast);

  renderUpcomingStrip(upcoming);
  renderMonthGrid(document.getElementById("main"), upcoming);

  const pastSection = document.getElementById("past-section");
  const pastSummary = document.getElementById("past-summary");
  if(past.length){
    pastSummary.textContent = `Vergangene Termine (${past.length}) anzeigen`;
    renderMonthGrid(document.getElementById("past-main"), past, "past");
    pastSection.hidden = false;
  } else {
    pastSection.hidden = true;
  }

  /* Sammel-Download: alle Termine (vergangen + kommend) als eine .ics-Datei */
  const feedLink = document.getElementById("feed-download");
  if(feedLink){
    const globalICS = buildGlobalICS(events);
    feedLink.href = "data:text/calendar;charset=utf-8," + encodeURIComponent(globalICS);
    const fname = yearRange ? `kita_termine_${yearRange.minY}${yearRange.minY!==yearRange.maxY ? "-"+yearRange.maxY : ""}.ics` : "kita_termine.ics";
    feedLink.setAttribute("download", fname);
  }
}

/* filters */
function setupFilters(){
  const filterButtons = document.querySelectorAll(".filter-btn");
  filterButtons.forEach(btn=>{
    btn.addEventListener("click", ()=>{
      filterButtons.forEach(b=>b.classList.remove("active"));
      btn.classList.add("active");
      filterByGroup(btn.dataset.group);
    });
  });
}
function filterByGroup(group){
  const cards = document.querySelectorAll(".card");
  cards.forEach(c=>{
    const gs = c.dataset.groups.split(",");
    if(group==="all" || gs.includes("all") || gs.map(x=>x.toLowerCase()).includes(group.toLowerCase())){
      c.style.display = "";
    } else c.style.display = "none";
  });
}

/* Kalender-Dropdowns schliessen, wenn irgendwo anders hingeklickt wird */
document.addEventListener("click", (e)=>{
  document.querySelectorAll("details.cal-menu[open]").forEach(d=>{
    if(!d.contains(e.target)) d.removeAttribute("open");
  });
});

/* LOAD: Termine aus events.json holen, validieren, rendern */
setupFilters();
fetch(EVENTS_URL)
  .then(r => {
    if(!r.ok) throw new Error(`events.json konnte nicht geladen werden (HTTP ${r.status})`);
    return r.json();
  })
  .then(events => {
    if(!Array.isArray(events)) throw new Error('events.json muss eine Liste von Terminen sein ([...])');
    const validated = events.map((ev,i)=>({ ev, err: validateEvent(ev,i) }));
    const errors = validated.filter(v=>v.err).map(v=>v.err);
    const validEvents = validated.filter(v=>!v.err).map(v=>v.ev);
    if(errors.length) console.warn("Fehlerhafte Termine in events.json:\n" + errors.join("\n"));
    renderEvents(validEvents);
    if(errors.length){
      const warn = document.createElement("div");
      warn.style.cssText = "max-width:1100px;margin:0 auto 20px;padding:14px 18px;background:#fff0da;border-radius:12px;color:#6a3f00;font-size:0.9rem;";
      warn.innerHTML = `⚠️ ${errors.length} Termin(e) in events.json haben ein Problem und wurden ausgeblendet. Details in der Browser-Konsole (Rechtsklick → Untersuchen → Konsole).`;
      document.getElementById("main").prepend(warn);
    }
  })
  .catch(err => {
    console.error(err);
    renderError(`${err.message}. Prüfe, ob events.json im selben Ordner liegt und gültiges JSON enthält (z.B. mit <a href="https://jsonlint.com" target="_blank" rel="noopener">jsonlint.com</a> pruefen).`);
  });

</script>
